<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maquetador de presupuestos · Majosoft</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f5f4ec; --cream2: #e9e8df; --line: #dcdbd0; --ink: #15161a; --ink2: #3a3a33;
      --muted: #6b6b62; --lime: #d6e022; --lime2: #aebb0c; --paper: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; }

    /* ===== Layout de la app ===== */
    .app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
    .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--ink); color: var(--cream); flex-wrap: wrap; }
    .app { grid-template-rows: auto 1fr; }
    .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; margin-right: auto; }
    .topbar .brand img { height: 22px; filter: invert(1); }
    .topbar .brand span { font-weight: 500; color: #a9a99c; }
    .btn { border: 1px solid #3a3a33; background: transparent; color: inherit; padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { border-color: var(--lime); }
    .btn--lime { background: var(--lime); color: var(--ink); border-color: var(--lime); }
    .btn--lime:hover { background: #e3ec4a; }

    .editor { overflow-y: auto; padding: 18px 18px 60px; border-right: 1px solid var(--line); background: var(--cream); }
    .preview-wrap { overflow: auto; padding: 32px; background: #dcdbd0; }

    details.sec { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
    details.sec > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; }
    details.sec > summary::after { content: "+"; color: var(--muted); }
    details.sec[open] > summary::after { content: "–"; }
    .sec-body { padding: 0 16px 16px; }
    label.f { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
    label.f input, label.f textarea, label.f select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; color: var(--ink); background: #fcfcf8; }
    label.f textarea { min-height: 70px; resize: vertical; }
    label.f input:focus, label.f textarea:focus { outline: 2px solid var(--lime); border-color: var(--ink); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 600; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .item { border: 1px dashed var(--line); border-radius: 10px; padding: 4px 12px 12px; margin-top: 12px; background: #fcfcf8; }
    .item-head { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-weight: 700; font-size: 12px; }
    .item-head .tools button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; margin-left: 4px; }
    .item-head .tools button:hover { border-color: var(--ink); }
    .add { margin-top: 12px; width: 100%; border: 1px dashed var(--ink2); background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; }
    .add:hover { background: var(--lime); border-style: solid; }

    /* ===== Documento ===== */
    .doc { width: 210mm; margin: 0 auto; display: flex; flex-direction: column; gap: 10mm; color: var(--ink); font-size: 10pt; line-height: 1.5; }
    /* Hojas A4 */
    .page { width: 210mm; height: 297mm; background: var(--paper); box-shadow: 0 20px 60px rgba(21,22,26,.18); display: flex; flex-direction: column; overflow: hidden; }
    .page-body { flex: 1; min-height: 0; padding: 12mm 18mm 0; overflow: hidden; }
    .page-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 7.5pt; padding: 4mm 18mm 8mm; border-top: 1px solid var(--line); margin: 0 18mm; padding-left: 0; padding-right: 0; }
    .flow { position: absolute; left: -9999px; top: 0; width: 210mm; visibility: hidden; }
    .doc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover { background: var(--ink); color: var(--cream); padding: 9mm 18mm 8mm; position: relative; overflow: hidden; }
    .cover::before { content: ""; position: absolute; width: 70mm; height: 70mm; border-radius: 50%; background: var(--lime); opacity: .14; filter: blur(30px); top: -35mm; right: -25mm; }
    .cover-top { display: flex; justify-content: space-between; align-items: center; font-size: 9pt; color: #a9a99c; position: relative; }
    .cover-top img { height: 20px; filter: invert(1); }
    .cover .kicker { margin-top: 6mm; display: inline-block; background: var(--lime); color: var(--ink); font-weight: 800; font-size: 8pt; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; position: relative; }
    .cover h1 { font-size: 21pt; line-height: 1.1; letter-spacing: -.03em; margin: 3mm 0 1.5mm; font-weight: 900; position: relative; }
    .cover .sub { font-size: 10.5pt; color: #e9e8df; margin: 0; position: relative; }
    .cover .tag { margin-top: 1.5mm; font-size: 8.5pt; color: var(--lime); font-weight: 600; position: relative; }
    .cover-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; margin-top: 5mm; padding-top: 3.5mm; border-top: 1px solid #3a3a33; position: relative; }
    .cover-meta div small { display: block; color: #a9a99c; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .1em; }
    .cover-meta div b { font-size: 9pt; }

    .body { padding: 12mm 18mm 16mm; }
    .h2 { display: flex; align-items: center; gap: 10px; font-size: 16pt; font-weight: 800; letter-spacing: -.02em; margin: 10mm 0 4mm; break-after: avoid; }
    .h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px var(--ink); flex: none; }
    .page-body > .h2:first-child, .page-body > :first-child { margin-top: 0; }
    p { margin: 0 0 3mm; }
    ul.b { margin: 2mm 0 0; padding: 0; list-style: none; }
    ul.b li { position: relative; padding-left: 14px; margin-bottom: 1.6mm; }
    ul.b li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 2px; background: var(--lime2); }
    ul.b.neg li::before { background: #c9c8bc; }

    .why { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 4mm; }
    .why div { background: var(--cream); border-radius: 3mm; padding: 3.5mm 4mm; break-inside: avoid; }
    .why b { display: block; font-size: 10pt; margin-bottom: 1mm; }
    .why span { color: var(--ink2); font-size: 9pt; }

    .mod { display: grid; grid-template-columns: 16mm 1fr; gap: 4mm; border: 1px solid var(--line); border-radius: 4mm; padding: 5mm; margin-bottom: 4mm; break-inside: avoid; }
    .mod--cont .mod-n::after { display: none; }
    .mod-n { font-size: 20pt; font-weight: 900; letter-spacing: -.04em; color: var(--ink); line-height: 1; }
    .mod-n::after { content: ""; display: block; width: 8mm; height: 3px; background: var(--lime); margin-top: 2mm; }
    .mod-head { display: flex; justify-content: space-between; gap: 4mm; align-items: flex-start; }
    .mod-head h3 { margin: 0; font-size: 12pt; letter-spacing: -.01em; }
    .badge { display: inline-block; background: var(--lime); color: var(--ink); font-size: 7pt; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
    .mod-price { text-align: right; white-space: nowrap; }
    .mod-price b { display: block; font-size: 13pt; }
    .mod-price small { color: var(--muted); }
    .mod-desc { color: var(--ink2); margin: 2mm 0 0; }

    table.sum { width: 100%; border-collapse: collapse; margin-top: 2mm; break-inside: avoid; }
    table.sum th { text-align: left; font-size: 7.5pt; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 2mm 3mm; border-bottom: 2px solid var(--ink); }
    table.sum td { padding: 2.3mm 3mm; border-bottom: 1px solid var(--line); }
    table.sum .r { text-align: right; white-space: nowrap; }
    table.sum tr.sub td { font-weight: 700; border-bottom: none; padding-top: 4mm; }
    table.sum tr.iva td { color: var(--muted); }
    table.sum tr.tot td { background: var(--ink); color: var(--cream); font-weight: 800; font-size: 12pt; border: none; }
    table.sum tr.tot td:first-child { border-radius: 3mm 0 0 3mm; }
    table.sum tr.tot td:last-child { border-radius: 0 3mm 3mm 0; color: var(--lime); }

    .callout { background: var(--cream); border-left: 4px solid var(--lime); border-radius: 0 3mm 3mm 0; padding: 4mm 5mm; margin: 3mm 0; break-inside: avoid; }
    .bono { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: center; background: var(--lime); border-radius: 4mm; padding: 6mm; margin-top: 4mm; break-inside: avoid; }
    .bono small { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 7.5pt; }
    .bono .price { font-size: 26pt; font-weight: 900; letter-spacing: -.04em; line-height: 1; text-align: right; }
    .bono .price span { display: block; font-size: 8pt; font-weight: 600; letter-spacing: 0; }

    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin: 4mm 0; break-inside: avoid; }
    .plan { border: 1px solid var(--line); border-radius: 4mm; padding: 5mm; }
    .plan:last-child { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .plan small { font-size: 7.5pt; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .plan:last-child small { color: var(--lime); }
    .plan .price { font-size: 20pt; font-weight: 900; letter-spacing: -.03em; margin: 2mm 0 1mm; }
    .plan .note { font-size: 8.5pt; opacity: .75; }
    .plan .scope { margin-top: 3mm; font-weight: 600; font-size: 9pt; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
    .cols h4, .req h4 { margin: 3mm 0 1mm; font-size: 10pt; }
    .req { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 6mm; }
    .req > div { break-inside: avoid; }

    .contact { margin-top: 10mm; background: var(--ink); color: var(--cream); border-radius: 4mm; padding: 6mm; display: flex; justify-content: space-between; align-items: center; break-inside: avoid; }
    .contact b { font-size: 12pt; display: block; }
    .contact span { color: #a9a99c; font-size: 9pt; }
    .contact img { height: 22px; filter: invert(1); }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; }
      .editor { border-right: none; }
      .preview-wrap { padding: 16px; }
      .doc { zoom: .45; }
    }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .topbar, .editor { display: none !important; }
      .app { display: block; height: auto; }
      .preview-wrap { padding: 0; background: #fff; overflow: visible; }
      .doc { width: 210mm; zoom: 1; gap: 0; }
      .page { box-shadow: none; break-after: page; }
      .page:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" style="color:inherit;text-decoration:none"><img src="../assets/logo.svg" alt="Majosoft" /> Majosoft <span>· Presupuestos</span></a>
      <a class="btn" href="facturas" style="text-decoration:none">Facturas</a>
      <button class="btn" id="bNew">Nuevo</button>
      <button class="btn" id="bLoad">Abrir JSON</button>
      <button class="btn" id="bSave">Guardar JSON</button>
      <button class="btn btn--lime" id="bPrint">Exportar PDF</button>
      <input type="file" id="file" accept="application/json" hidden />
    </header>
    <aside class="editor" id="editor"></aside>
    <main class="preview-wrap"><article class="doc" id="doc"></article></main>
  </div>

<script>

/* Modo automático: se parte del precio final con IVA, se quita el IVA
   y la base se reparte entre los módulos según sus horas (redondeo a 5 €). */
function repartir() {
  const base = Math.round(Number(D.totalConIva || 0) / (1 + D.iva / 100));
  const mods = D.modulos.filter(m => Number(m.horas) > 0);
  const H = mods.reduce((s, m) => s + Number(m.horas), 0);
  D.modulos.forEach(m => { if (!(Number(m.horas) > 0)) m.precio = 0; });
  if (!H) return;
  mods.forEach(m => m.precio = Math.round(base * m.horas / H / 5) * 5);
  const resto = base - mods.reduce((s, m) => s + m.precio, 0);
  mods.reduce((a, m) => m.horas > a.horas ? m : a).precio += resto;
}

function calc() {
  if (D.auto) repartir();
  const subtotal = D.modulos.reduce((s, m) => s + Number(m.precio || 0), 0);
  const horas = D.modulos.reduce((s, m) => s + Number(m.horas || 0), 0);
  const total = D.auto ? Number(D.totalConIva || 0) : Math.round(subtotal * (1 + D.iva / 100) * 100) / 100;
  return { subtotal, horas, iva: Math.round((total - subtotal) * 100) / 100, total };
}

/* Reparte los bloques del documento en hojas A4: si un bloque no cabe,
   pasa a la siguiente hoja; los títulos se llevan con su primer bloque. */
function paginar() {
  const doc = document.getElementById("doc");
  const flow = document.createElement("div");
  flow.className = "flow";
  flow.innerHTML = doc.innerHTML;
  doc.innerHTML = "";
  doc.after(flow);
  const cover = flow.querySelector(".cover");
  const bloques = [...flow.querySelector(".body").children];
  const pie = "Majosoft · Estudio de desarrollo de software en Jaén · Presupuesto válido 30 días desde su emisión";

  const pages = [];
  const nueva = () => {
    const pg = document.createElement("section");
    pg.className = "page";
    pg.innerHTML = `<div class="page-body"></div><div class="page-foot"><span>${pie}</span><span class="n"></span></div>`;
    doc.appendChild(pg); pages.push(pg);
    return pg.querySelector(".page-body");
  };
  let body = nueva();
  body.before(cover);
  const llena = () => body.scrollHeight > body.clientHeight + 1;

  for (let i = 0; i < bloques.length; i++) {
    const b = bloques[i];
    body.appendChild(b);
    if (!llena()) continue;
    if (body.children.length === 1) continue; // bloque más alto que una hoja: se queda
    // Rejillas (ventajas, requisitos): se parten por tarjetas entre hojas
    if (b.matches(".why, .req") && b.children.length > 2) {
      const resto = b.cloneNode(false);
      while (llena() && b.children.length > 2) { resto.prepend(b.lastElementChild); if (b.children.length % 2) resto.prepend(b.lastElementChild); }
      if (!llena()) { bloques.splice(i + 1, 0, resto); continue; }
      while (resto.firstElementChild) b.appendChild(resto.firstElementChild);
    }
    // Módulos: si no caben, sus puntos continúan en la hoja siguiente
    if (b.matches(".mod")) {
      const ul = b.querySelector("ul.b");
      if (ul && ul.children.length > 1) {
        const cont = b.cloneNode(true);
        const cul = cont.querySelector("ul.b"); cul.innerHTML = "";
        cont.querySelector(".mod-desc")?.remove();
        cont.querySelector(".mod-price")?.remove();
        cont.querySelector(".mod-n").textContent = "";
        cont.querySelector("h3").insertAdjacentHTML("beforeend", ' <small style="font-weight:500;color:var(--muted)">(continuación)</small>');
        cont.classList.add("mod--cont");
        while (llena() && ul.children.length > 1) cul.prepend(ul.lastElementChild);
        if (!llena()) { bloques.splice(i + 1, 0, cont); continue; }
        while (cul.firstElementChild) ul.appendChild(cul.firstElementChild);
      }
    }
    const prev = b.previousElementSibling;
    body = nueva();
    if (prev && prev.classList.contains("h2")) body.appendChild(prev);
    body.appendChild(b);
  }
  pages.forEach((pg, i) => pg.querySelector(".n").textContent = `Página ${i + 1} de ${pages.length}`);
  flow.remove();
}

  const c = calc();
  D.modulos.forEach((m, i) => {
    const el = ed.querySelector(`[data-p="modulos.${i}.precio"]`);
    if (!el) return;
    el.disabled = !!D.auto;

  });
  const h = document.getElementById("calcHint");
  if (h) h.textContent = D.auto
    ? `Base ${eur(c.subtotal)} + IVA ${eur(c.iva)} · ${c.horas} h · ${c.horas ? eur(Math.round(c.subtotal / c.horas * 100) / 100) : "—"}/h. Los precios de los módulos se reparten según sus horas (módulos con 0 h = incluido).`
    : "Modo manual: escribe el precio sin IVA de cada módulo y el total se calcula solo.";
}

  const t = el.dataset.t;
  set(p, t === "bool" ? el.checked : t === "num" ? (el.value === "" ? "" : Number(el.value)) : t === "lines" ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value);
  refresh(p === "auto");
});
ed.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add) { get(b.dataset.add).push(NUEVOS[b.dataset.add]()); return refresh(true); }
  const arr = get(b.dataset.arr), i = +b.dataset.i;
  if (b.dataset.act === "del" && confirm("¿Eliminar este elemento?")) arr.splice(i, 1);
  if (b.dataset.act === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
  if (b.dataset.act === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
  refresh(true);
});

/* ===== Acciones ===== */
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
document.getElementById("bPrint").onclick = () => window.print();
document.getElementById("bNew").onclick = () => {
  const ej = confirm("¿Empezar desde el ejemplo de Academia Online?\n\nAceptar = ejemplo · Cancelar = en blanco");
  if (!confirm("Se perderán los cambios no guardados en JSON. ¿Continuar?")) return;
  D = structuredClone(ej ? EJEMPLO : VACIO); refresh(true);
};
document.getElementById("bSave").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: "application/json" }));
  a.download = `presupuesto-${slug(D.titulo || "majosoft")}.json`; a.click(); URL.revokeObjectURL(a.href);
};
const file = document.getElementById("file");
document.getElementById("bLoad").onclick = () => file.click();
file.onchange = async () => {
  try { D = migrar({ ...structuredClone(VACIO), ...JSON.parse(await file.files[0].text()) }); refresh(true); }
  catch { alert("El archivo no es un presupuesto válido."); }
  file.value = "";
};

buildEditor(); render(); syncEditor();
document.fonts?.ready.then(render); // las medidas cambian al cargar Inter
</script>
