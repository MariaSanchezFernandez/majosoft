<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen · Panel Majosoft</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/panel.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); font-size: 14px; }
    main { max-width: 1180px; padding: 34px 32px 60px; }
    .hello { font-size: 13px; color: var(--muted); font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 10px; font: inherit; font-weight: 700; font-size: 13.5px; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    .btn:hover { border-color: var(--ink); }
    .btn--ink { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .btn--ink:hover { background: #2a2b26; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
    .kpi small { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .kpi b { display: block; font-size: 26px; letter-spacing: -.03em; margin-top: 6px; }
    .kpi span { font-size: 12px; color: var(--muted); }
    .kpi.dark { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .kpi.dark small, .kpi.dark span { color: #a9a99c; }
    .kpi.dark b { color: var(--lime); }
    .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-top: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
    .card h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: -.01em; }
    .card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .card-head a { font-size: 12.5px; font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--lime); }
    .bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; height: 190px; padding-top: 10px; }
    .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .bar i { display: block; width: 100%; max-width: 30px; background: var(--ink); border-radius: 4px 4px 0 0; min-height: 2px; }
    .bar.now i { background: var(--lime2); }
    .bar span { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .bar[data-v]:hover::before { content: attr(data-v); font-size: 11px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 11px 0; border-top: 1px solid #eeede5; font-size: 13.5px; }
    td.r { text-align: right; white-space: nowrap; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: #fafaf5; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.pendiente { background: #fff3cd; color: #7a5b00; }
    .pill.pagada { background: var(--lime); color: var(--ink); }
    .pill.borrador { background: #eeede5; color: var(--muted); }
    .ev { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #eeede5; font-size: 13px; }
    .ev .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--line); }
    .ev .dot.ok { background: var(--ok); } .ev .dot.bad { background: var(--bad); }
    .ev small { display: block; color: var(--muted); font-size: 11.5px; }
    .empty { color: var(--muted); padding: 14px 0; font-size: 13px; }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { main { padding: 24px 16px 40px; } .kpis { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="page-head">
      <div><div class="hello" id="hello"></div><h1>Resumen</h1><p>Estado comercial y de facturación del estudio.</p></div>
      <div class="actions"><a class="btn" href="/admin/presupuestos?nuevo=1">+ Presupuesto</a><a class="btn btn--ink" href="/admin/facturas?nuevo=1">+ Nueva factura</a></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="card">
        <h2>Facturación mensual</h2><p class="sub" id="chartSub"></p>
        <div class="bars" id="bars"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Actividad de la cuenta</h2><a href="/admin/seguridad">Seguridad</a></div>
        <p class="sub">Últimos accesos y cambios registrados.</p>
        <div id="activity"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Últimas facturas</h2><a href="/admin/facturas">Ver todas</a></div>
        <table id="lastInv"></table>
      </div>
      <div class="card">
        <div class="card-head"><h2>Presupuestos recientes</h2><a href="/admin/presupuestos">Ver todos</a></div>
        <table id="lastBud"></table>
      </div>
    </div>
  </main>
<script type="module">
import { mountShell, api } from "/admin/panel.js";
const me = await mountShell("home");
const h = new Date().getHours();
document.getElementById("hello").textContent = `${h < 14 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches"}, ${(me.name || me.email).split(" ")[0]}`;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const eur = n => Number(n || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: "always" }) + " €";
const totalF = f => { const b = f.lineas.reduce((s, l) => s + l.cantidad * l.precio, 0); return Math.round(b * (1 + f.iva / 100 - (f.irpf ?? 7) / 100) * 100) / 100; };
const totalP = p => p.auto ? Number(p.totalConIva || 0) : Math.round(p.modulos.reduce((s, m) => s + Number(m.precio || 0), 0) * (1 + p.iva / 100) * 100) / 100;

const [fac0, pre0, sec] = await Promise.all([api("docs/facturas"), api("docs/presupuestos"), api("security")]);
// Normaliza por si algún documento está incompleto
const fac = fac0.map(f => ({ numero: "", fecha: "", estado: "borrador", iva: 21, lineas: [], ...f, cliente: { nombre: "", ...(f.cliente || {}) } }));
const pre = pre0.map(p => ({ titulo: "", cliente: "", iva: 21, modulos: [], ...p }));
const y = String(new Date().getFullYear());
const emitidas = fac.filter(f => f.estado !== "borrador");
const sum = a => a.reduce((s, f) => s + totalF(f), 0);
document.getElementById("kpis").innerHTML = `
  <div class="kpi dark"><small>Facturado ${y}</small><b>${eur(sum(emitidas.filter(f => f.fecha.startsWith(y))))}</b><span>IVA incluido</span></div>
  <div class="kpi"><small>Pendiente de cobro</small><b>${eur(sum(fac.filter(f => f.estado === "pendiente")))}</b><span>${fac.filter(f => f.estado === "pendiente").length} facturas</span></div>
  <div class="kpi"><small>Cobrado</small><b>${eur(sum(fac.filter(f => f.estado === "pagada")))}</b><span>${fac.filter(f => f.estado === "pagada").length} facturas</span></div>
  <div class="kpi"><small>Presupuestos</small><b>${pre.length}</b><span>${eur(pre.reduce((s, p) => s + totalP(p), 0))} propuestos</span></div>`;

// Últimos 12 meses
const now = new Date(), months = [];
for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.toISOString().slice(0, 7)); }
const vals = months.map(m => sum(emitidas.filter(f => f.fecha.startsWith(m))));
const max = Math.max(...vals, 1);
document.getElementById("chartSub").textContent = `Últimos 12 meses · ${eur(vals.reduce((a, b) => a + b, 0))}`;
document.getElementById("bars").innerHTML = months.map((m, i) => `
  <div class="bar ${i === 11 ? "now" : ""}" data-v="${vals[i] ? eur(vals[i]) : ""}" title="${eur(vals[i])}">
    <i style="height:${(vals[i] / max) * 150}px"></i><span>${new Date(m + "-01").toLocaleDateString("es-ES", { month: "short" }).replace(".", "")}</span></div>`).join("");

document.getElementById("lastInv").innerHTML = fac.length ? [...fac].sort((a, b) => b.numero.localeCompare(a.numero)).slice(0, 6).map(f => `
  <tr class="click" data-href="/admin/facturas#${f.id}"><td><b>${esc(f.numero)}</b> · ${esc(f.cliente.nombre)}</td><td><span class="pill ${f.estado}">${f.estado}</span></td><td class="r"><b>${eur(totalF(f))}</b></td></tr>`).join("")
  : `<tr><td class="empty">Aún no hay facturas.</td></tr>`;
document.getElementById("lastBud").innerHTML = pre.length ? pre.slice(0, 6).map(p => `
  <tr class="click" data-href="/admin/presupuestos?id=${p.id}"><td><b>${esc(p.titulo)}</b><br /><span style="color:var(--muted);font-size:12px">${esc(p.cliente)}</span></td><td class="r"><b>${eur(totalP(p))}</b></td></tr>`).join("")
  : `<tr><td class="empty">Aún no hay presupuestos.</td></tr>`;
document.querySelectorAll("tr[data-href]").forEach(tr => tr.onclick = () => location.href = tr.dataset.href);

const EV = { login_ok: ["Inicio de sesión", "ok"], login_fail: ["Intento fallido", "bad"], account_locked: ["Cuenta bloqueada", "bad"], logout: ["Cierre de sesión", ""], "2fa_enabled": ["Verificación en dos pasos activada", "ok"], password_changed: ["Contraseña cambiada", "ok"], doc_created: ["Documento creado", ""], doc_deleted: ["Documento eliminado", ""], session_revoked: ["Sesión cerrada en otro dispositivo", ""], user_created: ["Usuario creado", ""], "2fa_reset": ["2FA reiniciada", "bad"], "2fa_disabled": ["2FA desactivada", ""], mail_connected: ["Buzón de correo conectado", "ok"], mail_disconnected: ["Buzón de correo desconectado", ""] };
const when = t => new Date(t).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
document.getElementById("activity").innerHTML = sec.audit.slice(0, 7).map(a => {
  const [label, cls] = EV[a.event] || [a.event, ""];
  return `<div class="ev"><span class="dot ${cls}"></span><div>${label}${a.detail && a.event.startsWith("doc") ? " · " + esc(a.detail) : ""}<small>${when(a.at)} · ${esc(a.ip || "")}</small></div></div>`;
}).join("") || `<div class="empty">Sin actividad.</div>`;
</script>
</body>
</html>
